; Production overrides, loaded after php.ini-production.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Render Free = 512 MB RAM total. Keep per-request memory bounded.
memory_limit = 256M
max_execution_time = 60

; Assignment submissions allow up to 10 MB (StoreAssignmentSubmissionRequest
; "max:10240"). PHP's default upload_max_filesize is only 2M.
upload_max_filesize = 12M
post_max_size = 14M

; OPcache: code is immutable inside the image, so never re-stat files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.use_strict_mode = 1
