<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Never serve dotfiles (.env, .git, .htaccess) even if one ends up in public/.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Vite assets are content-hashed: cache them forever.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The PWA service worker must always be revalidated after a deploy.
    <LocationMatch "^/build/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # Health probes are noisy; keep them out of the access log.
    SetEnvIf Request_URI "^/(up|health/ready)$" dontlog

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 proxy env=!dontlog
</VirtualHost>
